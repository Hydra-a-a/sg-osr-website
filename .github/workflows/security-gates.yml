name: Security Gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      dast_target_url:
        description: Optional HTTPS URL for manual DAST run (overrides repo variable)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  security-events: write

defaults:
  run:
    working-directory: .

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  app-security-checks:
    name: Lint + Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security Tests (Auth + Error + CSP)
        run: |
          npm run test:inline-style-scan
          tests=(
            tests/test-forms-auth-guard.js
            tests/test-session-token-boundary.js
            tests/test-email-transport-boundary.js
            tests/test-api-error-envelope.js
            tests/test-csp-policy.js
            tests/test-redacted-logging.js
            tests/test-ticket-security-hardening.js
            tests/test-ticket-owner-access.js
            tests/test-ticket-comments-appeals.js
            tests/test-ticket-update-notification-sync.js
            tests/test-portal-mode-auth.js
            tests/test-hub-guides-pdf-gating.js
            tests/test-directory-logo-pipeline.js
          )
          found=0
          for test_file in "${tests[@]}"; do
            if [[ -f "$test_file" ]]; then
              found=1
              echo "Running $test_file"
              node "$test_file"
            else
              echo "::warning file=$test_file::Skipping missing security regression test file"
            fi
          done
          if [[ "$found" -eq 0 ]]; then
            echo "::error::No security regression tests were found in tests/. Add the expected test files or adjust the workflow list."
            exit 1
          fi

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (JS/TS)
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review (PR)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  dependency-vuln-scan:
    name: Runtime Dependency Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Upload Trivy SARIF
        if: ${{ always() && github.event.repository.visibility == 'public' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  dast-baseline:
    name: DAST Baseline (OWASP ZAP)
    if: ${{ (github.event_name == 'schedule' && vars.DAST_TARGET_URL != '') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dast_target_url != '' || vars.DAST_TARGET_URL != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAST_TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dast_target_url || vars.DAST_TARGET_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Normalize DAST target URL
        run: |
          target="${DAST_TARGET_URL}"
          if [[ -z "$target" ]]; then
            echo "DAST_TARGET_URL is empty; skipping normalization."
            exit 0
          fi
          if [[ "$target" != http://* && "$target" != https://* ]]; then
            target="https://$target"
          fi
          echo "DAST_TARGET_URL=$target" >> "$GITHUB_ENV"
          echo "Using DAST target: $target"

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@2b5fc7f98d837319798ab7f128ea50b7d40563b6 # v0.14.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a -m 10'

  sbom-and-provenance:
    name: SBOM + Provenance Attestation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-node-module-generatebom@27e13c2bf0fae78d66387b35ca9749d8cc853060 # v1
        with:
          path: .
          output: bom.xml

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclonedx-sbom
          path: bom.xml

      - name: Attest SBOM provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-path: bom.xml

  openssf-scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@e93faf2ab2f3663b51bc6e62d42b8520f2eff874 # v2.3.1
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif
