[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "AUTH_TRUST_HOST,TICKET_UPDATE_CONTROL_MODE,GOOGLE_SERVICE_ACCOUNT_AUTH_PROVIDER_X509_CERT_URL,GOOGLE_SERVICE_ACCOUNT_AUTH_URI,GOOGLE_SERVICE_ACCOUNT_TOKEN_URI,GOOGLE_SERVICE_ACCOUNT_TYPE,GOOGLE_SERVICE_ACCOUNT_UNIVERSE_DOMAIN"


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "upgrade-insecure-requests"
